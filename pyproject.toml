[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwiresentinel"
version = "1.0.0"
description = "AI-assisted endpoint threat hunting platform for stealth persistence and suspicious outbound behavior"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
ghost-wire = "agent.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent*"]
